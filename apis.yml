aid: clickdiagnostics
name: mPower Social
description: 'mPower Social Enterprises Ltd. is a Dhaka, Bangladesh technology-for-development
  company founded in 2008 by Harvard and MIT graduate students as ClickDiagnostics — winner
  of the MIT $100K competition — and renamed after moving its center of gravity to Bangladesh
  in 2010. mPower designs, builds and operates information systems for governments, UN
  agencies, donor organizations and international NGOs across health and nutrition, water
  and sanitation, agriculture and livestock, education, governance and rights, livelihood
  and poverty alleviation, climate and environment, and humanitarian response, and states
  it has deployed more than 300 ICT solutions across 17 countries in the Global South. Its
  engineering practice is built on open-source digital public goods — DHIS2, OpenMRS,
  OpenSRP / FHIR Core, Bahmni and Moodle — which it customizes, integrates and supports for
  national health management information systems, electronic medical records and shared
  health records, rather than shipping a hosted product of its own. The company is ISO
  9001:2015 certified. mPower publishes no public API, developer portal, or machine-readable
  contract; its public software surface is a GitHub organization made up largely of
  downstream forks of the open-source health platforms it implements, plus a set of
  first-party Android apps on Google Play.'
